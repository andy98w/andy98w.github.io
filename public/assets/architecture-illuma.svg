<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Illuma multi-agent architecture</title><desc id="desc">A student workspace sends work to a coordinator and typed specialist tools that share validated application state and use university data and a prediction model.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#a15638"/></marker><style>.t{font:600 13px system-ui,sans-serif;fill:#292e24}.s{font:11px system-ui,sans-serif;fill:#67695b}.n{fill:#f4f0e7;stroke:#868876;stroke-width:1.3}.g{fill:#dfe4d7;stroke:#6f7564;stroke-width:1.3}.o{fill:none;stroke:#a15638;stroke-width:1.7;marker-end:url(#a)}.d{fill:none;stroke:#8c8e7d;stroke-width:1.3;stroke-dasharray:5 5}.label{font:700 10px system-ui,sans-serif;letter-spacing:1.4px;fill:#a15638}</style></defs>
  <text class="label" x="34" y="30">STUDENT EXPERIENCE</text><text class="label" x="315" y="30">COORDINATION</text><text class="label" x="686" y="30">EVIDENCE</text>
  <rect class="n" x="34" y="72" width="180" height="92" rx="4"/><text class="t" x="54" y="104">Student workspace</text><text class="s" x="54" y="126">profile · essays · list</text><text class="s" x="54" y="145">conversation history</text>
  <rect class="g" x="292" y="66" width="176" height="104" rx="5"/><text class="t" x="316" y="99">Agent coordinator</text><text class="s" x="316" y="121">routes typed requests</text><text class="s" x="316" y="141">merges validated results</text><path class="o" d="M214 118h78"/>
  <rect class="n" x="256" y="221" width="118" height="64" rx="4"/><text class="t" x="274" y="247">School research</text><text class="s" x="274" y="267">fit and evidence</text>
  <rect class="n" x="391" y="221" width="118" height="64" rx="4"/><text class="t" x="409" y="247">Essay review</text><text class="s" x="409" y="267">rubrics and edits</text>
  <rect class="n" x="526" y="221" width="118" height="64" rx="4"/><text class="t" x="544" y="247">List planning</text><text class="s" x="544" y="267">reach · target · likely</text>
  <path class="o" d="M380 170v24h-65v27M380 194h70v27M450 194h135v27"/>
  <rect class="g" x="256" y="307" width="388" height="34" rx="4"/><text class="t" x="278" y="328">Shared state + deterministic validators</text>
  <path class="d" d="M315 285v22M450 285v22M585 285v22"/>
  <rect class="n" x="686" y="66" width="180" height="64" rx="4"/><text class="t" x="706" y="93">University data</text><text class="s" x="706" y="113">130 schools</text>
  <rect class="n" x="686" y="164" width="180" height="76" rx="4"/><text class="t" x="706" y="191">Prediction pipeline</text><text class="s" x="706" y="211">XGBoost</text><text class="s" x="706" y="228">79k applicant outcomes</text>
  <path class="o" d="M776 130v34"/><path class="o" d="M686 202H505q-37 0-37-32"/>
</svg>
