<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Summit Tutoring Center content publishing flow</title><desc id="desc">Staff edit Google Sheets, the website parses published CSV data and caches the last valid response, and a React build is served from DreamHost.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#a15638"/></marker><style>.t{font:600 13px system-ui,sans-serif;fill:#292e24}.s{font:11px system-ui,sans-serif;fill:#67695b}.n{fill:#f4f0e7;stroke:#868876;stroke-width:1.3}.g{fill:#dfe4d7;stroke:#6f7564;stroke-width:1.3}.o{fill:none;stroke:#a15638;stroke-width:1.7;marker-end:url(#a)}.d{fill:none;stroke:#8c8e7d;stroke-width:1.3;stroke-dasharray:5 5}.label{font:700 10px system-ui,sans-serif;letter-spacing:1.4px;fill:#a15638}</style></defs>
  <text class="label" x="34" y="34">EDIT</text><text class="label" x="346" y="34">PUBLISH</text><text class="label" x="690" y="34">SERVE</text>
  <rect class="n" x="34" y="76" width="184" height="92" rx="4"/><text class="t" x="56" y="106">Tutoring staff</text><text class="s" x="56" y="128">schedules · seminars</text><text class="s" x="56" y="147">posts</text>
  <rect class="g" x="304" y="76" width="184" height="92" rx="4"/><text class="t" x="326" y="106">Google Sheets</text><text class="s" x="326" y="128">familiar editor</text><text class="s" x="326" y="147">published CSV feeds</text><path class="o" d="M218 122h86"/>
  <rect class="n" x="574" y="76" width="184" height="92" rx="4"/><text class="t" x="596" y="106">React website</text><text class="s" x="596" y="128">CSV parser</text><text class="s" x="596" y="147">five-minute cache</text><path class="o" d="M488 122h86"/>
  <rect class="n" x="574" y="240" width="184" height="72" rx="4"/><text class="t" x="596" y="268">DreamHost</text><text class="s" x="596" y="289">existing business hosting</text><path class="o" d="M666 168v72"/>
  <rect class="n" x="304" y="240" width="184" height="72" rx="4"/><text class="t" x="326" y="268">Last good response</text><text class="s" x="326" y="289">stale fallback on failure</text><path class="d" d="M488 276h46q40 0 40-40v-68"/>
  <rect class="n" x="34" y="240" width="184" height="72" rx="4"/><text class="t" x="56" y="268">Inquiry form</text><text class="s" x="56" y="289">Web3Forms → email draft</text><path class="d" d="M218 276h52v-76h304"/>
</svg>
