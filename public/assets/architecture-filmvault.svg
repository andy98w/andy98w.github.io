<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">FilmVault application architecture</title><desc id="desc">A React client calls an Express API. The API combines TMDB catalog data with FilmVault member accounts, ratings, collections, email, and profile-image storage.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#a15638"/></marker><style>.t{font:600 13px system-ui,sans-serif;fill:#292e24}.s{font:11px system-ui,sans-serif;fill:#67695b}.n{fill:#f4f0e7;stroke:#868876;stroke-width:1.3}.g{fill:#dfe4d7;stroke:#6f7564;stroke-width:1.3}.o{fill:none;stroke:#a15638;stroke-width:1.7;marker-end:url(#a)}.d{fill:none;stroke:#8c8e7d;stroke-width:1.3;stroke-dasharray:5 5}.label{font:700 10px system-ui,sans-serif;letter-spacing:1.4px;fill:#a15638}</style></defs>
  <text class="label" x="36" y="30">CLIENT</text><text class="label" x="350" y="30">APPLICATION</text><text class="label" x="664" y="30">DATA SOURCES</text>
  <rect class="n" x="36" y="91" width="178" height="94" rx="4"/><text class="t" x="58" y="122">React client</text><text class="s" x="58" y="144">search · people · profiles</text><text class="s" x="58" y="163">ratings · collections</text>
  <rect class="g" x="336" y="75" width="216" height="126" rx="4"/><text class="t" x="360" y="108">Express API</text><text class="s" x="360" y="130">auth + admin middleware</text><text class="s" x="360" y="149">catalog composition</text><text class="s" x="360" y="168">profile image processing</text><path class="o" d="M214 138h122"/>
  <rect class="n" x="664" y="48" width="200" height="68" rx="4"/><text class="t" x="686" y="76">TMDB API</text><text class="s" x="686" y="96">movies · TV · cast · crew</text>
  <rect class="n" x="664" y="145" width="200" height="82" rx="4"/><text class="t" x="686" y="173">App database</text><text class="s" x="686" y="194">users · ratings · collections</text><text class="s" x="686" y="212">MySQL / local SQLite</text>
  <rect class="n" x="664" y="256" width="200" height="68" rx="4"/><text class="t" x="686" y="284">Email + OCI storage</text><text class="s" x="686" y="304">account mail · profile images</text>
  <path class="o" d="M552 113l112-31M552 154l112 31M552 181l112 109"/>
  <path class="d" d="M336 242h216"/><text class="label" x="336" y="267">ORIGINAL OCI BOUNDARY</text><text class="s" x="336" y="290">VCN · Nginx/TLS · compute · Vault/IAM</text><text class="s" x="336" y="309">Terraform retained; paid deployment not required for local demo</text>
</svg>
