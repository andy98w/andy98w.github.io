<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Ledgly reconciliation architecture</title><desc id="desc">Gmail payment notices pass through extraction and a treasurer review gate before the NestJS API writes payment allocations and audit history to PostgreSQL.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#a15638"/></marker><style>.t{font:600 13px system-ui,sans-serif;fill:#292e24}.s{font:11px system-ui,sans-serif;fill:#67695b}.n{fill:#f4f0e7;stroke:#868876;stroke-width:1.3}.g{fill:#dfe4d7;stroke:#6f7564;stroke-width:1.3}.w{fill:#efe0d8;stroke:#a15638;stroke-width:1.4}.o{fill:none;stroke:#a15638;stroke-width:1.7;marker-end:url(#a)}.d{fill:none;stroke:#8c8e7d;stroke-width:1.3;stroke-dasharray:5 5}.label{font:700 10px system-ui,sans-serif;letter-spacing:1.4px;fill:#a15638}</style></defs>
  <text class="label" x="32" y="28">PAYMENT INTAKE</text><text class="label" x="348" y="28">CONTROL POINT</text><text class="label" x="646" y="28">FINANCIAL SYSTEM</text>
  <rect class="n" x="32" y="66" width="140" height="72" rx="4"/><text class="t" x="52" y="94">Gmail API</text><text class="s" x="52" y="115">read-only notices</text>
  <rect class="n" x="210" y="66" width="140" height="72" rx="4"/><text class="t" x="230" y="94">Match worker</text><text class="s" x="230" y="115">amount · sender · memo</text><path class="o" d="M172 102h38"/>
  <rect class="w" x="388" y="58" width="178" height="88" rx="4"/><text class="t" x="410" y="88">Treasurer review</text><text class="s" x="410" y="109">confidence + candidate</text><text class="s" x="410" y="128">confirm or correct</text><path class="o" d="M350 102h38"/>
  <rect class="g" x="646" y="58" width="220" height="88" rx="4"/><text class="t" x="669" y="88">NestJS API</text><text class="s" x="669" y="109">organization roles</text><text class="s" x="669" y="128">validated write path</text><path class="o" d="M566 102h80"/>
  <rect class="n" x="32" y="236" width="188" height="76" rx="4"/><text class="t" x="52" y="265">Next.js workspace</text><text class="s" x="52" y="286">balances · review · reports</text>
  <rect class="n" x="270" y="236" width="188" height="76" rx="4"/><text class="t" x="290" y="265">Confirmed AI tools</text><text class="s" x="290" y="286">same RBAC + audit path</text>
  <rect class="n" x="646" y="214" width="220" height="110" rx="4"/><text class="t" x="669" y="243">PostgreSQL + Prisma</text><text class="s" x="669" y="266">charges · payments · expenses</text><text class="s" x="669" y="284">allocations</text><path class="d" d="M669 296h174"/><text class="s" x="669" y="313">before/after audit log</text>
  <path class="o" d="M220 274h50M458 274h188M756 146v68"/><path class="o" d="M126 236V176q0-30 30-30h510"/>
</svg>
