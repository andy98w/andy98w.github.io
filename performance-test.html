<!doctype html><html lang="en"><meta charset="utf-8"><title>Frame delivery comparison</title><style>body{font:16px system-ui;background:#161915;color:white;margin:24px}button{padding:12px;margin:8px}#host{position:relative;width:min(960px,90vw);height:540px;overflow:hidden}canvas,.journey-still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.journey-still{opacity:0}.journey-still.is-visible{opacity:1}pre{white-space:pre-wrap}</style><h1>Frame delivery comparison</h1><p>Same camera route. Sequence: 1080p. Video: 4K. Enhanced stopping images are shared.</p><button id="frames">Test image sequence</button><button id="video">Test 4K video</button><div id="host"></div><pre id="results">Choose a renderer. Each test waits for buffering, then runs the same forward/reverse route.</pre><script type="module">
import {FrameJourney} from './src/frame-journey.js';import {VideoJourney} from './src/video-journey.js';
let player;const host=document.querySelector('#host'),out=document.querySelector('#results');const segments=[{path:'/assets/journey-frames/courtyard',count:145},{path:'/assets/journey-frames/approach',count:36},{path:'/assets/journey-frames/desk',count:242}];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function run(kind){document.querySelectorAll('button').forEach(b=>b.disabled=true);player?.dispose();player=new(kind==='video'?VideoJourney:FrameJourney)(host,segments);player.setProgress(0);out.textContent='Buffering '+kind+' for 5 seconds…';await sleep(5000);let last=performance.now(),start=last,intervals=[],errors=[],changes=0,previous=-1;
await new Promise(resolve=>{function step(now){const elapsed=now-start;if(elapsed>12000){resolve();return}const progress=elapsed<8000?elapsed/8000:1-(elapsed-8000)/4000;player.setProgress(progress);intervals.push(now-last);last=now;errors.push(Math.abs(player.target-player.displayed));if(player.displayed!==previous){changes++;previous=player.displayed}requestAnimationFrame(step)}requestAnimationFrame(step)});
player.setProgress(.673);await sleep(1500);const sorted=a=>a.slice().sort((x,y)=>x-y),pct=(a,p)=>sorted(a)[Math.floor((a.length-1)*p)];out.textContent=JSON.stringify({renderer:kind,test:'8s forward + 4s reverse, after 5s buffering',displayedChanges:changes,medianFrameError:pct(errors,.5),p95FrameError:pct(errors,.95),medianAnimationIntervalMs:+pct(intervals,.5).toFixed(1),p95AnimationIntervalMs:+pct(intervals,.95).toFixed(1),stallsOver50ms:intervals.filter(x=>x>50).length,videoResolution:kind==='video'?`${player.video.videoWidth}x${player.video.videoHeight}`:null},null,2);document.querySelectorAll('button').forEach(b=>b.disabled=false)}
document.querySelector('#frames').onclick=()=>run('frames');document.querySelector('#video').onclick=()=>run('video');
</script></html>
